name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.1 (empty dry-runs the version in mix.exs)
        required: false

concurrency:
  group: release

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-release.yml@ci-v1
    with:
      version: ${{ inputs.version }}
      postgres: true
      partitions: 4
      pre-test: |
        mix ash.codegen ci
        mix localize.download_locales fa
      credo: false
      dialyzer: false
      ex_dna: false
      unused-deps: false
      assets: true
      bun-version: "1.4.4"
      github-release: true
      ebin: true
      ebin-paths: " "
    secrets: inherit
